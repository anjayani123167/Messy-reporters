# coturn for OfficeDesk. Port, public IP, realm and secret come from docker-compose.yml (.env).
# Credentials are short-lived HMACs issued by the OfficeDesk server ("use-auth-secret"),
# only for sessions the host accepted. No static users.
use-auth-secret
fingerprint
no-cli
no-tls
no-dtls
no-multicast-peers
no-tcp-relay
# Relay port range: open these UDP ports in the VPS firewall too.
min-port=49160
max-port=49360
# Abuse limits: a remote-desktop stream needs well under 50 Mbit/s.
total-quota=200
user-quota=8
max-bps=6250000
stale-nonce=600
# Never relay into private or local networks (protects the VPS's own network).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
